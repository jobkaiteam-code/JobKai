services:
  # =================================================================
  # API GATEWAY - Central entry point for all services
  # =================================================================
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: jobkai-api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - FOOTPRINT_URL=http://footprint-service:8001
      - RESUME_REVIEWER_URL=http://resume-reviewer-service:8002
      - JOB_MATCHER_URL=http://job-matcher-service:8003
      - AI_INTERVIEWER_URL=http://ai-interviewer-service:8004
    depends_on:
      footprint-service:
        condition: service_healthy
      resume-reviewer-service:
        condition: service_healthy
      job-matcher-service:
        condition: service_healthy
      ai-interviewer-service:
        condition: service_healthy
    networks:
      - jobkai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # =================================================================
  # FOOTPRINT SERVICE - Analyzes developer presence (GitHub, StackOverflow)
  # =================================================================
  footprint-service:
    build:
      context: ./backend/footprint
      dockerfile: Dockerfile
    container_name: jobkai-footprint-service
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - jobkai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # =================================================================
  # RESUME REVIEWER SERVICE - Analyzes and improves resumes using Groq API
  # =================================================================
  resume-reviewer-service:
    build:
      context: ./backend/Resume_Reviewer_and_Rewriter
      dockerfile: Dockerfile
    container_name: jobkai-resume-reviewer-service
    restart: unless-stopped
    expose:
      - "8002"
    environment:
      - PYTHONUNBUFFERED=1
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./backend/Resume_Reviewer_and_Rewriter/temp_files:/app/temp_files
      - ./backend/Resume_Reviewer_and_Rewriter/generated_resumes:/app/generated_resumes
    networks:
      - jobkai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =================================================================
  # JOB MATCHER SERVICE - Matches jobs with candidate CVs using Findwork API
  # =================================================================
  job-matcher-service:
    build:
      context: ./backend/Job_matcher_from_linkedin-main
      dockerfile: Dockerfile
    container_name: jobkai-job-matcher-service
    restart: unless-stopped
    expose:
      - "8003"
    environment:
      - PYTHONUNBUFFERED=1
      - FINDWORK_API_KEY=${FINDWORK_API_KEY}
    networks:
      - jobkai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # =================================================================
  # AI INTERVIEWER SERVICE - Generates interview questions and feedback
  # =================================================================
  ai-interviewer-service:
    build:
      context: ./backend/ai-interviewer
      dockerfile: Dockerfile
    container_name: jobkai-ai-interviewer-service
    restart: unless-stopped
    expose:
      - "8004"
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./backend/ai-interviewer:/app
      - ./backend/api-gateway/job-kai-firebase-adminsdk-fbsvc-9244ba7dc4.json:/app/../api-gateway/job-kai-firebase-adminsdk-fbsvc-9244ba7dc4.json:ro
    networks:
      - jobkai-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8004/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # =================================================================
  # FRONTEND - React web application
  # =================================================================
  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
        VITE_PUBLIC_FIREBASE_API_KEY: ${VITE_PUBLIC_FIREBASE_API_KEY}
        VITE_PUBLIC_FIREBASE_AUTH_DOMAIN: ${VITE_PUBLIC_FIREBASE_AUTH_DOMAIN}
        VITE_PUBLIC_FIREBASE_PROJECT_ID: ${VITE_PUBLIC_FIREBASE_PROJECT_ID}
        VITE_PUBLIC_FIREBASE_STORAGE_BUCKET: ${VITE_PUBLIC_FIREBASE_STORAGE_BUCKET}
        VITE_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${VITE_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        VITE_PUBLIC_FIREBASE_APP_ID: ${VITE_PUBLIC_FIREBASE_APP_ID}
        VITE_MEASUREMENT_ID: ${VITE_MEASUREMENT_ID:-}
        VITE_VAPI_PUBLIC_KEY: ${VITE_VAPI_PUBLIC_KEY}
    container_name: jobkai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - jobkai-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  jobkai-network:
    driver: bridge

volumes:
  resume-temp-files:
  resume-generated-files:
