apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-matcher-service
  namespace: jobkai
  labels:
    app: job-matcher-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-matcher-service
  template:
    metadata:
      labels:
        app: job-matcher-service
        tier: backend
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
      - name: job-matcher-service
        image: jobkairegistry.azurecr.io/job-matcher:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8003
          protocol: TCP
        env:
        - name: FINDWORK_API_KEY
          valueFrom:
            secretKeyRef:
              name: jobkai-secrets
              key: FINDWORK_API_KEY
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 120
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 90
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: job-matcher-service
  namespace: jobkai
  labels:
    app: job-matcher-service
spec:
  type: ClusterIP
  ports:
  - port: 8003
    targetPort: 8003
    protocol: TCP
    name: http
  selector:
    app: job-matcher-service
