apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume-reviewer-service
  namespace: jobkai
  labels:
    app: resume-reviewer-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resume-reviewer-service
  template:
    metadata:
      labels:
        app: resume-reviewer-service
        tier: backend
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
      - name: resume-reviewer-service
        image: jobkairegistry.azurecr.io/resume-reviewer:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8002
          protocol: TCP
        env:
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: jobkai-secrets
              key: GROQ_API_KEY
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: jobkai-secrets
              key: GOOGLE_API_KEY
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: resume-reviewer-service
  namespace: jobkai
  labels:
    app: resume-reviewer-service
spec:
  type: ClusterIP
  ports:
  - port: 8002
    targetPort: 8002
    protocol: TCP
    name: http
  selector:
    app: resume-reviewer-service
