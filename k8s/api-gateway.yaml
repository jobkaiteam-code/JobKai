apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: jobkai
  labels:
    app: api-gateway
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: backend
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
      - name: api-gateway
        image: jobkairegistry.azurecr.io/api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          protocol: TCP
        env:
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: jobkai-secrets
              key: GROQ_API_KEY
        - name: FOOTPRINT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: jobkai-config
              key: FOOTPRINT_SERVICE_URL
        - name: RESUME_REVIEWER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: jobkai-config
              key: RESUME_REVIEWER_SERVICE_URL
        - name: JOB_MATCHER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: jobkai-config
              key: JOB_MATCHER_SERVICE_URL
        - name: AI_INTERVIEWER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: jobkai-config
              key: AI_INTERVIEWER_SERVICE_URL
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: jobkai
  labels:
    app: api-gateway
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: api-gateway
