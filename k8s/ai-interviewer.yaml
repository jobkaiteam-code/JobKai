apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-interviewer-service
  namespace: jobkai
  labels:
    app: ai-interviewer-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-interviewer-service
  template:
    metadata:
      labels:
        app: ai-interviewer-service
        tier: backend
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
      - name: ai-interviewer-service
        image: jobkairegistry.azurecr.io/ai-interviewer:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8004
          protocol: TCP
        env:
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: jobkai-secrets
              key: GROQ_API_KEY
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: jobkai-secrets
              key: GOOGLE_API_KEY
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8004
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-interviewer-service
  namespace: jobkai
  labels:
    app: ai-interviewer-service
spec:
  type: ClusterIP
  ports:
  - port: 8004
    targetPort: 8004
    protocol: TCP
    name: http
  selector:
    app: ai-interviewer-service
