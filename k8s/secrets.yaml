apiVersion: v1
kind: Secret
metadata:
  name: jobkai-secrets
  namespace: jobkai
type: Opaque
stringData:
  # API Keys - Replace with your actual values
  GROQ_API_KEY: "{{ groq_api_key }}"
  FINDWORK_API_KEY: "{{ findwork_api_key }}"
  GOOGLE_API_KEY: "{{ google_api_key }}"
  VITE_VAPI_PUBLIC_KEY: "{{ vapi_public_key }}"
  
  # Firebase Configuration
  VITE_FIREBASE_API_KEY: "{{ firebase_api_key }}"
  VITE_FIREBASE_AUTH_DOMAIN: "{{ firebase_auth_domain }}"
  VITE_FIREBASE_PROJECT_ID: "{{ firebase_project_id }}"
  VITE_FIREBASE_STORAGE_BUCKET: "{{ firebase_storage_bucket }}"
  VITE_FIREBASE_MESSAGING_SENDER_ID: "{{ firebase_messaging_sender_id }}"
  VITE_FIREBASE_APP_ID: "{{ firebase_app_id }}"
  VITE_FIREBASE_MEASUREMENT_ID: "{{ firebase_measurement_id }}"
  
  # API Gateway URL
  VITE_API_URL: "http://api-gateway.jobkai.svc.cluster.local:8000"
---
apiVersion: v1
kind: Secret
metadata:
  name: acr-secret
  namespace: jobkai
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: "{{ acr_docker_config_json }}"
