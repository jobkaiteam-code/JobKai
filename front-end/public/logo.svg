<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="#000000"/>
  
  <!-- Glowing circle -->
  <circle cx="256" cy="256" r="200" fill="url(#purpleGradient)" opacity="0.15"/>
  
  <!-- J Letter -->
  <path d="M 160 150 L 160 300 Q 160 360 210 360 Q 260 360 260 300 L 260 280" 
        stroke="url(#purpleGradient)" 
        stroke-width="35" 
        fill="none" 
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>
  
  <!-- K Letter -->
  <g filter="url(#glow)">
    <line x1="300" y1="150" x2="300" y2="360" 
          stroke="url(#purpleGradient)" 
          stroke-width="35" 
          stroke-linecap="round"/>
    <path d="M 300 240 L 390 150" 
          stroke="url(#purpleGradient)" 
          stroke-width="35" 
          stroke-linecap="round"/>
    <path d="M 300 240 L 390 360" 
          stroke="url(#purpleGradient)" 
          stroke-width="35" 
          stroke-linecap="round"/>
  </g>
  
  <!-- AI Accent dots -->
  <circle cx="420" cy="100" r="12" fill="#a855f7" opacity="0.6"/>
  <circle cx="450" cy="120" r="8" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="90" cy="420" r="12" fill="#a855f7" opacity="0.6"/>
  <circle cx="70" cy="450" r="8" fill="#8b5cf6" opacity="0.6"/>
</svg>
