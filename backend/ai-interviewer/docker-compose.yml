version: '3.8'

services:
  ai-interviewer:
    build: .
    container_name: jobkai-ai-interviewer-service
    ports:
      - "8004:8004"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - .:/app
      - ../api-gateway/job-kai-firebase-adminsdk-fbsvc-9244ba7dc4.json:/app/../api-gateway/job-kai-firebase-adminsdk-fbsvc-9244ba7dc4.json:ro
    networks:
      - jobkai-network
    restart: unless-stopped

networks:
  jobkai-network:
    external: true
